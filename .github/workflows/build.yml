name: Android CI Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build Android App & Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Decode Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          echo "Decoding debug.keystore from base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        else
          echo "No debug.keystore.base64 file found, Gradle will fallback."
        fi

    - name: Decode Release Keystore (main push only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      run: |
        echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
        echo "Release keystore decoded."

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        cache-read-only: false

    - name: Build and Run Unit Tests
      run: |
        gradle test

    - name: Build Debug APK
      run: |
        gradle assembleDebug

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TomatoPomodoro-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Build Release APK (main push only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        gradle assembleRelease

    - name: Rename Release APK (main push only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        mkdir -p release-out
        cp app/build/outputs/apk/release/app-release.apk "release-out/洋柿子ToDo-v${VERSION}.apk"
        ls -la release-out/

    - name: Upload Release APK Artifact (main push only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: 洋柿子ToDo-Release-APK
        path: release-out/*.apk
        retention-days: 30

    - name: Publish GitHub Release (main push only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: 洋柿子ToDo v${{ env.VERSION }}
        generate_release_notes: true
        files: release-out/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
